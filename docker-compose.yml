version: "3.8"

services:
  # Database PostgreSQL
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dana_clone
    ports:
      - "5432:5432"
    volumes:
      # Volume ini membuat data database TETAP ADA meski container
      # dihentikan/dihapus dan dibuat ulang - tanpa ini, semua data
      # akan hilang setiap kali 'docker-compose down' dijalankan.
      - dana_clone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Go API
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db # nama service di atas, Docker otomatis resolve ini jadi alamat IP container db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: dana_clone
      JWT_SECRET: ganti-dengan-secret-yang-lebih-aman
      APP_PORT: 8080
    depends_on:
      db:
        condition: service_healthy # tunggu database siap dulu sebelum start API

volumes:
  dana_clone_pgdata: